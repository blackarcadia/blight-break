name: BlightBreak
version: '${version}'

main: org.axial.blightBreak.BlightBreak
api-version: '1.21.11'
load: POSTWORLD
softdepend:
  - LuckPerms

commands:
  test:
    description: Sends a test greeting.
    usage: /test
  plot:
    description: Claims, visits, or deletes a Blightbreak plot.
    usage: /plot <claim|home|delete>
  residue:
    description: Gives Blighted Residue to a player.
    usage: /residue give <player> <amount>
