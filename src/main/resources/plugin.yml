name: BlightBreak
version: '${version}'

main: org.axial.blightBreak.BlightBreak
api-version: '1.21.11'
load: POSTWORLD

commands:
  test:
    description: Sends a test greeting.
    usage: /test
  plot:
    description: Claims a plot in the Blightbreak Wasteland.
    usage: /plot <claim|home>
  residue:
    description: Gives Blighted Residue to a player.
    usage: /residue give <player> <amount>
